name: PDF validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.6
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv run --locked python -m pytest -q tests/pdf_layout tests/accessibility
      - run: uv run --locked python -m scripts.publishing.render_sample --output var/sutra-preview.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-preview
          path: var/sutra-preview.pdf
          retention-days: 7
