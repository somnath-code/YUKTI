name: Package private release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    if: github.event.repository.private
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.6
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv run --locked python -m scripts.verification.structure
      - run: uv run --locked python -m pytest -q
      - run: git archive --format=zip --prefix=yukti/ --output=yukti.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: yukti-release
          path: yukti.zip
          retention-days: 14
