[project]
name = "yukti"
version = "1.1.0"
description = "YUKTI research intelligence and the SUTRA weekly magazine"
requires-python = ">=3.12,<3.13"

dependencies = [
    "cryptography==50.0.0",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "Jinja2==3.1.6",
    "psycopg[binary]==3.2.9",
    "pydantic==2.13.4",
    "PyJWT==2.15.0",
    "pypdf==6.21.4",
    "weasyprint==70.0",
    "PyYAML==6.0.3",
    "fastapi==0.162.4",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = ["pytest==8.4.1"]
spark = ["pyspark==4.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: needs an explicitly enabled local service",
    "spark: launches a local Java Spark process"
]
